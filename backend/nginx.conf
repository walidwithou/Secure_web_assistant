# Nginx reverse-proxy snippet for the Secure Web Assistant phishing API.
# Include this in your site's server block, or deploy as a standalone file in
# /etc/nginx/sites-available/phishing_api and symlink into sites-enabled.
#
#   include /etc/nginx/sites-available/phishing_api;

server {
    listen 80;
    server_name phishing-api.local;  # replace with your domain

    # Low-latency browser extension queries: keep timeouts tight.
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # Allow reasonably sized JSON bodies (URL + optional HTML).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable buffering for low-latency delivery of results.
        proxy_buffering off;
    }

    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
    }
}